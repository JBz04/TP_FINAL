services:

  db:
    image: postgres:16-alpine
    container_name: wikijs-db
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: motdepasse_wiki
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - wiki-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 10s
      retries: 5

  wiki:
    build: .
    image: mon-wikijs:1.0
    container_name: wikijs
    volumes:
      - ./config.yml:/opt/wiki/config.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wiki-net
    restart: unless-stopped

networks:
  wiki-net:
    driver: bridge

volumes:
  db-data:
